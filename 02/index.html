<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript</title>
        <script>
            function raiz(arg){

                var raiz = Math.sqrt(arg);

                alert('A raiz quadrada de ' + (arg) + ' é: ' + raiz);

            }    

            function escreveDiv(texto){

                document.getElementById("minhaDiv").innerHTML = texto;

            }  

            function escreveDiv2(texto){
                texto = prompt('Digite um texto qualquer');
                document.getElementById("minhaDiv2").innerHTML = texto;

            }  

            function escreveDiv3(){

                let n = prompt('Digite o valor de N: ');

                n = parseInt(n);

                let div = document.getElementById("minhaDiv3");
                    div.innerHTML = "";
                    if (isNaN(n) || n <= 0) {
                    alert("Por favor, insira um número válido maior que zero. ");
                    return;
                }

                for(let i = 1; i <= n; i++) {
                    div.innerHTML += i + "<br>";
                }

            }  
            
            function escreverNumerosInput() {
                var input = document.getElementById("numeroInput");
                var n = parseInt(input.value);
                if (isNaN(n) || n <= 0) {
                    alert("Por favor, insira um número válido maior que zero. ");
                    return;
                }

                var div = document.getElementById("numerosInput");
                div.innerHTML = "";
                for (var i = 1 ; i <= n; i++) {
                    div.innerHTML += i + "<br>";
                }
            }


            function raizdeN() {
                var input = document.getElementById("numeroRaiz");
                var n = parseInt(input.value);
                if (isNaN(n) || n <= 0) {
                    alert("Por favor, insira um número válido maior que zero.");
                    return;
                }

                var resultado = Math.sqrt(n);
                var div = document.getElementById("resultadoRaiz");
                div.innerHTML = "A raiz quadrada de " + n + " é: " + resultado;
            }

     
    

        </script>







</head>
<body>
    <h1>Raiz Quadrada</h1>
    <button onclick="raiz(25)">Raíz de 25</button>
    <br>
    <br>

    <button onclick="raiz(36)">Raíz de 36</button>
    <br>
    <br>

    <button onclick="raiz(49)">Raíz de 49</button>
    <br>
    <br>

    <hr>

    <h1>Escrevendo na Div</h1>
    <button onclick="escreveDiv('<h1> Programação Web</h1>')">Escrever</button>
    <div id="minhaDiv"></div>

    <br>
    <br>

    <hr>

    <h1>Escrevendo Texto Dinâmico</h1>
    <button onclick="escreveDiv2()">Escrever</button>
    <div id="minhaDiv2"></div>

    <br>
    <br>
    <hr>

    <h1>Desafio</h1>
    <button onclick="escreveDiv3()">Escreve Números</button>
    <div id="minhaDiv3"></div>

    <br>
    <br>

    <hr>

    <h1>Desafio com Input</h1>
    <label for="numeroInput">Digite o valor de N:</label>
    <input type="number" id="numeroInput" placeholder="Digite um número" min="1">
    <button onclick="escreverNumerosInput()">Escrever números</button>

    <div id="numerosInput"></div>
    <br>
    <br>

    <hr>

   <h1>Desafio: Raiz Quadrada de N</h1>
   
        <label for="numeroRaiz">Digite o valor de N:</label>
        <input type="number" id="numeroRaiz" placeholder="Digite um número" min="1">
        <button onclick="raizdeN()">Raiz de N</button>
        <div id="resultadoRaiz"></div>
     
</body>
</html>
