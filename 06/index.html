<!DOCTYPE html> <html lang="pt-BR"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Bootstrap CSS --> <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"> <title>Cadastro de Cursos</title> <script> let pilhaCursos = []; let indiceEdicao = null; // Mostra os cursos cadastrados na tabela function mostrarLista() { const corpo = document.getElementById('tabelaCorpo'); corpo.innerHTML = ''; for (let i = 0; i < pilhaCursos.length; i++) { const curso = pilhaCursos[i]; const linha = "<tr>" + "<td>" + i + "</td>" + "<td>" + curso.nome + "</td>" + "<td>" + curso.regime + "</td>" + "<td>" + curso.carga + " h</td>" + "<td>" + "<button class='btn btn-secondary btn-sm me-2' onclick='editarCurso(" + i + ")'>Editar</button>" + "<button class='btn btn-danger btn-sm' onclick='removerCurso(" + i + ")'>Remover</button>" + "</td>" + "</tr>"; corpo.innerHTML += linha; } } // Limpa os campos do formulário function limpaCampos() { document.getElementById('nome').value = ''; document.getElementById('regime').value = ''; document.getElementById('carga').value = ''; indiceEdicao = null; } // Consulta um curso pela posição function posicao() { const indice = Number( prompt('Qual posição da lista deseja consultar?') ); if ( isNaN(indice) || indice < 0 || indice >= pilhaCursos.length || !Number.isInteger(indice) ) { alert('Posição inválida!'); return; } const curso = pilhaCursos[indice]; alert( 'Na posição ' + indice + ' está:\n\n' + 'Nome: ' + curso.nome + '\nRegime: ' + curso.regime + '\nCarga Horária: ' + curso.carga + ' h' ); } // Limpa toda a lista function limparLista() { if (pilhaCursos.length === 0) { alert('A pilha já está vazia!'); return; } pilhaCursos = []; mostrarLista(); } // Remove o último curso da pilha function remover() { if (pilhaCursos.length === 0) { alert('A pilha está vazia!'); } else { const removido = pilhaCursos.pop(); alert( 'Removido:\n\n' + 'Nome: ' + removido.nome + '\nRegime: ' + removido.regime + '\nCarga Horária: ' + removido.carga + ' h' ); mostrarLista(); } } // Inverte a ordem da pilha function inverterPilha() { pilhaCursos.reverse(); mostrarLista(); } // Salva ou atualiza um curso function salvar() { const nome = document.getElementById('nome').value.trim(); const regime = document.getElementById('regime').value; const carga = document.getElementById('carga').value.trim(); // Validação if (nome === '') { alert('Digite o nome do curso.'); return; } if (regime === '') { alert('Selecione o regime.'); return; } if (carga === '') { alert('Digite a carga horária.'); return; } const curso = { nome: nome, regime: regime, carga: carga }; // Novo cadastro if (indiceEdicao === null) { pilhaCursos.push(curso); alert('Curso cadastrado com sucesso!'); } // Edição else { pilhaCursos[indiceEdicao] = curso; alert('Curso atualizado com sucesso!'); indiceEdicao = null; } limpaCampos(); mostrarLista(); } // Edita um curso function editarCurso(indice) { const curso = pilhaCursos[indice]; document.getElementById('nome').value = curso.nome; document.getElementById('regime').value = curso.regime; document.getElementById('carga').value = curso.carga; indiceEdicao = indice; } // Remove um curso específico function removerCurso(indice) { if (confirm('Deseja realmente remover este curso?')) { pilhaCursos.splice(indice, 1); mostrarLista(); } } </script> </head> <body> <div class="container mt-5">
<h1 class="mb-4 text-center">Cadastro de Cursos</h1>

<div class="card p-4 shadow-sm">

  <div class="row g-3">

    <!-- Nome do curso -->
    <div class="col-md-5">
      <label for="nome" class="form-label">Nome do Curso</label>

      <input
        type="text"
        id="nome"
        class="form-control"
        placeholder="Digite o nome do curso"
      >
    </div>

    <!-- Regime -->
    <div class="col-md-4">
      <label for="regime" class="form-label">Regime</label>

      <select id="regime" class="form-select">
        <option value="">Selecione o regime</option>
        <option value="Superior">Superior</option>
        <option value="Médio">Médio</option>
        <option value="Técnico">Técnico</option>
      </select>
    </div>

    <!-- Carga horária -->
    <div class="col-md-3">
      <label for="carga" class="form-label">Carga Horária (h)</label>

      <input
        type="number"
        id="carga"
        class="form-control"
        placeholder="Ex.: 360"
        min="1"
      >
    </div>

  </div>

  <div class="mt-3 d-flex gap-2">

    <button
      class="btn btn-secondary"
      onclick="salvar()"
    >
      Salvar
    </button>

    <button
      class="btn btn-outline-secondary"
      onclick="limpaCampos()"
    >
      Limpar Campos
    </button>

  </div>

</div>

<hr>

<!-- Operações da pilha -->

<button
  class="btn btn-secondary"
  onclick="posicao()"
>
  Posição
</button>

<button
  class="btn btn-danger"
  onclick="remover()"
>
  Remover Último
</button>

<button
  class="btn btn-danger"
  onclick="limparLista()"
>
  Limpar Lista
</button>

<button
  class="btn btn-secondary"
  onclick="inverterPilha()"
>
  Inverter
</button>

<br><br>

<!-- Tabela -->

<div id="minhaDiv">

  <table class="table table-bordered table-striped align-middle shadow-sm">

    <thead class="table-dark">

      <tr>
        <th>#</th>
        <th>Nome</th>
        <th>Regime</th>
        <th>Carga Horária</th>
        <th>Ações</th>
      </tr>

    </thead>

    <tbody id="tabelaCorpo">
      <!-- Linhas serão inseridas aqui -->
    </tbody>

  </table>

</div>

<hr>

</div> </body> </html>
