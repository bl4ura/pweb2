<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lista de Pessoas</title>
    <div id="minhaDiv"></div>

    <hr>

    <script>

       let pilhaPessoas = [];

       function mostrarLista() { 
            const container = document.getElementById('minhaDiv'); 
            
            container.innerHTML = '';
            
            for (let i = 0; i < pilhaPessoas.length; i++) { 
                const pessoa = document.createElement("h5");

                pessoa.textContent = i + " - " + pilhaPessoas[i];
                container.appendChild(pessoa);
            }
        } 
        function adicionar() { 
            let nome = prompt('Qual o nome da pessoa?'); 
            
            if (nome === null) {
                return;
            }

            nome = nome.trim();

            if (nome === "") {
                alert("Por favor, digite um nome válido!");
                return;
            }

            pilhaPessoas.push(nome);

            mostrarLista();
        }

        
        function posicao() { 
            let indice = prompt('Qual posição da lista deseja consultar?');
            
            indice = Number(indice);
            
            if (
                 isNaN(indice) ||
                 indice < 0 ||
                 indice >= pilhaPessoas.length 
            )  {
                
                
                alert('Posição inválida!');
                return;
            } 
                
            alert( 
                'Na posição ' +
                indice + 
                ' está: ' + 
                pilhaPessoas[indice] 
            );
            
        } 

        function remover() { 
            if (pilhaPessoas.length === 0) {
                alert('A pilha está vazia!');
                return;
            }

            let removido = pilhaPessoas.pop(); 
            
            alert('Pessoa removida: ' + removido);
            
            mostrarLista();
        } 
        
        function limparLista() { 
            if (pilhaPessoas.length === 0) {
                alert('A lista já está vazia!'); 
                return;
            } 
            
            pilhaPessoas = [];
            
            mostrarLista();
        } 
        
        function inverterPilha() {
            if (pilhaPessoas.length === 0) { 
                alert('A lista está vazia!'); 
                return; 
            } 
            
            pilhaPessoas.reverse();
            
            
            mostrarLista();
        } 
    </script>
 </head>  
   

<body>
    <h1>Lista de Pessoas</h1>
    <button onclick="adicionar()">Adicionar Pessoa</button> 
    <button onclick="posicao()">Posição</button> 
    <button onclick="remover()">Remover</button> 
    <button onclick="limparLista()">Limpar</button> 
    <button onclick="inverterPilha()">Inverter Pilha</button> 
    <div id="minhaDiv"></div> 
    
    
    <hr>

</body>

</html>
