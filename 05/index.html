<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Livros</title>

  <script>
    
    let pilhaLivros = [];

    function mostrarLista() {
      const container = document.getElementById('minhaDiv');
      container.innerHTML = ''; 

      for (let i = 0; i < pilhaLivros.length; i++) {
        const livro = pilhaLivros[i];
        const tag = '<h5>' + i + '- Título: ' + livro.nome + ' | Autor: ' + livro.autor + ' | Ano: ' + livro.ano + '</h5>';
        container.innerHTML += tag;
      }
    }
	
    function limpaCampos() {
      document.getElementById('nome').value = '';
      document.getElementById('autor').value = '';
      document.getElementById('ano').value = '';
    }

    function adicionar() {
    const nome = document.getElementById('nome').value;
    const autor = document.getElementById('autor').value;
    const ano = document.getElementById('ano').value;

    const indice = Number(prompt('Em qual posição deseja adicionar o livro?'));

    if (indice < 0 || indice > pilhaLivros.length || !Number.isInteger(indice)) {
        alert('Posição inválida!');
        return;
    }

    const livro = { nome, autor, ano };

    pilhaLivros.splice(indice, 0, livro);

    alert('Livro adicionado na posição ' + indice + '!');

    limpaCampos();
    mostrarLista();
}

    function posicao() {
      const indice = Number(prompt('Qual posição da lista deseja consultar?'));

      if (indice < 0 || indice >= pilhaLivros.length || !Number.isInteger(indice)) {
        alert('Posição inválida!');
        return;
      }

      const livro = pilhaLivros[indice];
      alert('Na posição ' + indice + ' está: Título: ' + livro.nome + ' - Autor: ' + livro.autor + ' - Ano: ' + livro.ano);
    }

    function limparLista() {
      pilhaLivros = [];
      mostrarLista();
    }

    function remover() {
      if (pilhaLivros.length === 0) {
        alert('A pilha está vazia!');
      } else {
        const removido = pilhaLivros.pop();
        alert('Removido: ' + removido.nome + ' - ' + removido.autor + ' - ' + removido.ano);
        mostrarLista();
      }
    }

    function inverterPilha() {
      pilhaLivros.reverse();
      mostrarLista();
    }
  </script>
</head>

<body>
  <h1>Lista de Livros</h1>

  <label>Nome:</label>
  <input type="text" id="nome" placeholder="Digite o nome"> 

  <label>Autor:</label>
  <input type="text" id="autor" placeholder="Digite o autor">

  <label>Ano:</label>
  <input type="text" id="ano" placeholder="Digite o ano">

  <button onclick="adicionar()">Adicionar</button>
	
	
  <hr>

  <button onclick="posicao()">Posição</button>
  <button onclick="remover()">Remover Último</button>
  <button onclick="limparLista()">Limpar Lista</button>
  <button onclick="inverterPilha()">Inverter</button>

  <br><br>
  
  <div id="minhaDiv"></div>
  
  <hr>

  
</body>
</html>
